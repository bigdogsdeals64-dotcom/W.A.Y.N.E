name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Gradle files
        working-directory: WAYNE
        run: |
          echo "--- app/build.gradle ---"
          sed -n '1,120p' app/build.gradle
          echo "--- root build.gradle ---"
          sed -n '1,80p' build.gradle
          echo "--- searching for kapt ---"
          grep -R "kapt" -n . || true

      - name: Build debug APK
        working-directory: WAYNE
        run: |
          rm -rf ~/.gradle/caches
          gradle --no-daemon --no-build-cache clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WAYNE-debug-apk
          path: WAYNE/app/build/outputs/apk/debug/*.apk
